<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Telegram authentication regression checks</title></head>
<body>
  <!-- Open /tests/telegram-auth.html on the Vite dev server.
       Uses real Login/Account components in StrictMode, with isolated fake storage
       and a fake backend. No bot, production credentials or external API calls. -->
  <pre id="results">Running…</pre>
  <div id="fixture"></div>
  <script type="module">
    import { createElement as h, Fragment, StrictMode } from 'react'
    import { createRoot } from 'react-dom/client'
    import { MemoryRouter, Routes, Route, Navigate, useLocation, useNavigate, useNavigationType } from 'react-router-dom'
    import Login from '../src/pages/Login.jsx'
    import Account from '../src/pages/Account.jsx'
    import Plans from '../src/pages/Plans.jsx'
    import AccountLogoutButton from '../src/components/AccountLogoutButton.jsx'
    import App from '../src/App.jsx'
    import SupportAction from '../src/components/SupportAction.jsx'
    import { validateSupportUrl } from '../src/lib/support.js'

    const host = document.querySelector('#fixture')
    const results = []
    const tokenKey = 'lcp_access_token'
    const challengeKey = 'lcp_login_challenge'
    const profile = { id: 123456, first_name: 'Test User', username: 'test_user', last_name: null }
    const raw = 'query_id=fixture%2Bvalue&user=%7B%7D&hash=test-only'
    let root, config, requests, popups, locations, currentPath, navigationType, blockStorage, logoutErrors, navigate
    const storage = () => {
      const data = new Map()
      return {
        getItem: key => data.get(key) ?? null,
        setItem: (key, value) => {
          if (blockStorage) throw new DOMException('Test storage failure', 'QuotaExceededError')
          data.set(key, String(value))
        },
        removeItem: key => {
          if (config.failRemoveToken) throw new DOMException('Test storage failure', 'SecurityError')
          data.delete(key)
        },
      }
    }
    const pause = ms => new Promise(resolve => setTimeout(resolve, ms))
    const assert = (condition, label) => { if (!condition) throw new Error(label) }
    async function waitFor(condition, label) {
      for (let i = 0; i < 320; i++) {
        if (condition()) return
        await pause(25)
      }
      throw new Error(`Timed out: ${label}`)
    }
    function Probe() {
      currentPath = useLocation().pathname
      navigationType = useNavigationType()
      navigate = useNavigate()
      locations.push(currentPath)
      return null
    }
    const count = path => requests.filter(request => request.path === path).length
    const click = label => {
      const button = [...host.querySelectorAll('button')].find(element => element.textContent === label || element.getAttribute('aria-label') === label)
      assert(button, `Missing button: ${label}`)
      button.click()
    }
    async function mount(path, options = {}) {
      root?.unmount()
      await pause(100)
      config = options
      requests = []; popups = []; locations = []; logoutErrors = []; blockStorage = false
      if (!options.reuseStorage) Object.defineProperty(window, 'localStorage', { configurable: true, value: storage() })
      Object.defineProperty(window, 'sessionStorage', { configurable: true, value: storage() })
      if (options.savedLanguage !== undefined) localStorage.setItem('lcp_language', options.savedLanguage)
      if (!options.showCookieBanner) localStorage.setItem('cookies-accepted', 'true')
      if (options.token) localStorage.setItem(tokenKey, options.token)
      if (options.challenge) sessionStorage.setItem(challengeKey, JSON.stringify({
        login_id: 'a'.repeat(32), browser_token: 'fixture-browser-token', expiresAt: Date.now() + 300000,
      }))
      blockStorage = Boolean(options.blockStorage)
      window.Telegram = options.browser ? options.telegram : { WebApp: { initData: raw } }
      window.open = () => {
        popups.push('opened')
        return { closed: false, close() { this.closed = true }, location: { replace: url => popups.push(url) } }
      }
      window.fetch = async (url, request = {}) => {
        const path = new URL(url, location.href).pathname.replace(/^\/api/, '')
        requests.push({ path, method: request.method || 'GET' })
        await pause(40)
        if (request.signal?.aborted) throw new DOMException('Aborted', 'AbortError')
        if (path === '/auth/telegram-webapp') {
          assert(JSON.parse(request.body).init_data === raw, 'Raw initData must be sent unchanged')
          return config.fail
            ? Response.json({ detail: 'invalid_telegram_webapp_data' }, { status: config.fail })
            : Response.json({ access_token: config.issuedToken || 'fixture-jwt', token_type: 'bearer', user: profile })
        }
        if (path === '/auth/me') {
          return !config.rejectProfile && request.headers.Authorization === `Bearer ${config.issuedToken || 'fixture-jwt'}`
            ? Response.json(config.profile || profile)
            : Response.json({ detail: 'invalid_token' }, { status: 401 })
        }
        if (path === '/auth/bot/start') return Response.json({
          login_id: 'a'.repeat(32), browser_token: 'fixture-browser-token', expires_in: 300,
          telegram_url: 'https://t.me/example_bot?start=login_fixture',
        })
        if (path.startsWith('/auth/bot/status/')) {
          assert(request.headers['X-Login-Token'] === 'fixture-browser-token', 'Polling must carry browser proof')
          return Response.json({ status: 'approved', access_token: 'fixture-jwt', user: profile })
        }
        throw new Error('Unexpected API request')
      }
      root = createRoot(host)
      root.render(h(StrictMode, null, h(MemoryRouter, { initialEntries: [path] },
        h(Probe), options.fullApp ? h(App) : h(Routes, null,
          h(Route, { path: '/login', element: h(Login, { lang: options.lang || 'en' }) }),
          h(Route, { path: '/app', element: h(Fragment, null,
            h('div', null, h(AccountLogoutButton, { lang: options.lang || 'en', onError: error => logoutErrors.push(error) })),
            h(Account, { lang: options.lang || 'en' }),
          ) }),
          h(Route, { path: '/account', element: h(Navigate, { to: '/app', replace: true }) }),
          h(Route, { path: '/', element: h('p', null, 'Home') }),
        ),
      )))
    }
    const loaded = () => currentPath === '/app' && host.querySelector('.dashboard-profile')
    const failed = () => host.querySelector('[role="alert"]')
    const noChallenge = () => {
      assert(!requests.some(request => request.path.startsWith('/auth/bot/')), 'Mini App must not start/poll challenges')
      assert(popups.length === 0, 'Mini App must not open Telegram links')
    }
    async function check(label, run) { await run(); results.push(label) }
    // Optional headless driver hook for native keyboard and overflow checks.
    window.mountPlansForFunctionalChecks = async lang => {
      await mount('/plans', { fullApp: true, browser: true, savedLanguage: lang })
      await waitFor(() => host.querySelector('#plans-title'), 'Plans functional fixture')
    }
    function internalBack() {
      const link = host.querySelector('.internal-page-title .internal-back')
      assert(link?.getAttribute('href') === '/app' && link.getAttribute('aria-label'), 'Missing accessible internal back link')
      assert(link.nextElementSibling?.tagName === 'H1', 'Back arrow is not beside the title')
      const bounds = link.getBoundingClientRect()
      assert(bounds.width >= 44 && bounds.height >= 44, 'Back link touch target is too small')
      return link
    }
    function watchForHeader() {
      let rendered = Boolean(host.querySelector('header'))
      const inspect = records => {
        for (const record of records) for (const node of [...record.addedNodes, ...record.removedNodes]) {
          if (node.nodeType === Node.ELEMENT_NODE && (node.matches('header') || node.querySelector('header'))) rendered = true
        }
      }
      const observer = new MutationObserver(inspect)
      observer.observe(host, { childList: true, subtree: true })
      return () => {
        inspect(observer.takeRecords())
        observer.disconnect()
        return rendered
      }
    }

    try {
      await check('StrictMode /app: one exchange, direct account, stored JWT', async () => {
        await mount('/app', { challenge: true })
        await waitFor(loaded, 'account auto-login')
        assert(count('/auth/telegram-webapp') === 1, 'Duplicate Mini App exchange')
        assert(localStorage.getItem(tokenKey) === 'fixture-jwt', 'JWT not saved')
        assert(!locations.includes('/login'), 'Unnecessary login redirect')
        noChallenge()
      })
      await check('StrictMode /login: neutral state, one exchange, account redirect', async () => {
        await mount('/login', { challenge: true })
        await waitFor(() => host.textContent.includes('Signing in through Telegram'), 'authenticating state')
        assert(!host.querySelector('a[target="_blank"]'), 'Browser confirmation link was shown')
        await waitFor(loaded, 'login auto-login')
        assert(navigationType === 'REPLACE', 'Mini App login added a history entry')
        assert(count('/auth/telegram-webapp') === 1, 'Duplicate Mini App exchange')
        noChallenge()
      })
      await check('Legacy /account replaces the route with /app', async () => {
        await mount('/account', { token: 'fixture-jwt' })
        await waitFor(loaded, 'legacy account redirect')
        assert(navigationType === 'REPLACE', 'Legacy route added a history entry')
        assert(count('/auth/telegram-webapp') === 0, 'Legacy route changed authentication')
      })
      await check('Existing valid JWT uses /me without Mini App exchange', async () => {
        await mount('/app', { token: 'fixture-jwt' })
        await waitFor(loaded, 'existing JWT')
        assert(count('/auth/telegram-webapp') === 0, 'Valid JWT unnecessarily replaced')
      })
      await check('Expired JWT recovers via one Mini App exchange', async () => {
        await mount('/app', { token: 'expired-fixture' })
        await waitFor(loaded, 'expired JWT recovery')
        assert(count('/auth/telegram-webapp') === 1, 'Incorrect recovery count')
        noChallenge()
      })
      for (const path of ['/app', '/login']) {
        await check(`${path}: failure stays put; explicit retry succeeds`, async () => {
          await mount(path, { fail: 401, lang: 'ru' })
          await waitFor(failed, 'Mini App failure')
          await pause(150)
          assert(currentPath === path, 'Failure redirected')
          assert(count('/auth/telegram-webapp') === 1, 'Failure retried automatically')
          assert(host.textContent.includes('Не удалось войти через Telegram'), 'Missing RU error')
          config.fail = false
          click('Попробовать снова')
          await waitFor(loaded, 'retry')
          assert(count('/auth/telegram-webapp') === 2, 'Retry count')
          noChallenge()
        })
      }
      await check('Rejected issued JWT stops with retry rather than redirect loop', async () => {
        await mount('/app', { rejectProfile: true })
        await waitFor(failed, 'rejected profile')
        await pause(150)
        assert(currentPath === '/app' && count('/auth/telegram-webapp') === 1, 'Auth loop')
        assert(!localStorage.getItem(tokenKey), 'Rejected JWT retained')
      })
      await check('Storage failure produces a retry state without redirect', async () => {
        await mount('/login', { blockStorage: true })
        await waitFor(failed, 'storage failure')
        assert(host.textContent.includes('Allow site storage'), 'Missing storage guidance')
        assert(currentPath === '/login', 'Storage error redirected')
      })
      await check('Unmounted exchange cannot save a late JWT', async () => {
        await mount('/app')
        await waitFor(() => count('/auth/telegram-webapp') === 1, 'exchange start')
        root.unmount(); root = null
        await pause(150)
        assert(!localStorage.getItem(tokenKey), 'Unmounted page saved JWT')
      })
      await check('Normal browser retains start → deep link → poll → JWT → /me', async () => {
        await mount('/app', { browser: true })
        await waitFor(() => currentPath === '/login' && host.textContent.includes('Login with Telegram'), 'browser login')
        assert(requests.length === 0, 'Browser login started without user action')
        click('Login with Telegram')
        await waitFor(loaded, 'browser challenge login')
        assert(navigationType === 'REPLACE', 'Browser login added a history entry')
        assert(count('/auth/bot/start') === 1, 'Browser challenge count')
        assert(popups.some(value => value.startsWith('https://t.me/')), 'Missing Telegram link')
        assert(count('/auth/telegram-webapp') === 0, 'Browser used Mini App auth')
        assert(!sessionStorage.getItem(challengeKey), 'Consumed challenge retained')
      })
      await check('Mini App logout removes the old JWT, exchanges raw initData and replaces /app without landing', async () => {
        await mount('/app')
        await waitFor(loaded, 'logout setup')
        config.issuedToken = 'renewed-fixture-jwt'
        click('Logout')
        assert(!localStorage.getItem(tokenKey), 'Old JWT was not removed synchronously')
        await waitFor(() => currentPath === '/login', 'automatic reauthentication')
        await waitFor(loaded, 'logout reauthenticated')
        await pause(150)
        assert(localStorage.getItem(tokenKey) === 'renewed-fixture-jwt', 'Fresh JWT was not stored')
        assert(count('/auth/telegram-webapp') === 2, 'Logout did not use exactly one new exchange')
        assert(!locations.includes('/') && navigationType === 'REPLACE', 'Logout exposed landing or added history')
        noChallenge()
      })
      await check('Browser logout clears JWT and replaces the route with /login', async () => {
        await mount('/app', { browser: true, token: 'fixture-jwt' })
        await waitFor(loaded, 'browser logout setup')
        click('Logout')
        await waitFor(() => currentPath === '/login', 'browser logout')
        assert(!localStorage.getItem(tokenKey), 'Browser JWT retained')
        assert(navigationType === 'REPLACE', 'Logout added history')
        assert(count('/auth/telegram-webapp') === 0, 'Browser logout exchanged initData')
      })
      await check('Failed logout reports storage error without navigating or losing the profile', async () => {
        await mount('/app', { browser: true, token: 'fixture-jwt' })
        await waitFor(loaded, 'failed logout setup')
        config.failRemoveToken = true
        click('Logout')
        await waitFor(() => logoutErrors.length === 1, 'logout error')
        assert(logoutErrors[0].includes('Allow site storage'), 'Missing logout error')
        assert(loaded() && localStorage.getItem(tokenKey) === 'fixture-jwt', 'Failed logout navigated')
      })
      await check('Logout during an in-flight exchange reuses secure authentication without duplicate requests', async () => {
        await mount('/app')
        await waitFor(() => count('/auth/telegram-webapp') === 1, 'pending logout setup')
        click('Logout')
        assert(!localStorage.getItem(tokenKey), 'Pending logout retained JWT')
        await waitFor(loaded, 'pending logout reauthenticated')
        await pause(150)
        assert(localStorage.getItem(tokenKey) === 'fixture-jwt' && count('/auth/telegram-webapp') === 1, 'Pending auth duplicated')
        assert(locations.includes('/login') && !locations.includes('/'), 'Pending logout exposed landing')
        noChallenge()
      })
      await check('Global RU default, explicit EN persistence, public page and next visit', async () => {
        await mount('/app', { fullApp: true, browser: true, token: 'fixture-jwt', showCookieBanner: true })
        await waitFor(loaded, 'full dashboard')
        assert(host.querySelector('#dashboard-title').textContent === 'Личный кабинет', 'Default is not RU')
        assert(host.querySelector('.cookie-accept')?.textContent === 'Принять', 'Cookie banner did not use RU')
        assert(!localStorage.getItem('lcp_language'), 'Implicit default was persisted')
        assert(!host.querySelector('header'), 'Browser dashboard retained global header')
        assert(host.querySelector('.profile-settings .logout-btn')?.title === 'Выйти', 'Missing RU profile logout')
        assert(!host.querySelector('.internal-back'), 'Dashboard has an unnecessary back arrow')
        const theme = localStorage.getItem('theme')
        click('Настройки аккаунта')
        await waitFor(() => !host.querySelector('.profile-settings-panel').inert, 'browser language controls')
        click('Переключить на английский')
        await waitFor(() => document.documentElement.lang === 'en', 'EN toggle')
        assert(localStorage.getItem('lcp_language') === 'en', 'EN not persisted')
        assert(host.querySelector('.cookie-accept')?.textContent === 'Accept', 'Cookie banner did not switch to EN')
        click('Accept')
        await waitFor(() => !host.querySelector('.cookie-banner'), 'cookie consent')
        assert(localStorage.getItem('cookies-accepted') === 'true', 'Cookie acceptance changed')
        assert(localStorage.getItem('theme') === theme, 'Language changed theme')
        navigate('/')
        await waitFor(() => host.querySelector('.connect-btn')?.textContent === 'Connect', 'public EN')
        assert(!host.querySelector('header .logout-btn'), 'Public header has logout')
        click('Account')
        await waitFor(loaded, 'return to dashboard')
        await mount('/app', { fullApp: true, browser: true, reuseStorage: true })
        await waitFor(loaded, 'restored EN visit')
        assert(host.querySelector('#dashboard-title').textContent === 'Your Account', 'Saved EN not restored')
      })
      await check('Invalid global language falls back to RU and dashboard identity stays real', async () => {
        await mount('/app', { fullApp: true, browser: true, token: 'fixture-jwt', savedLanguage: 'invalid',
          profile: { ...profile, first_name: 'Настоящее имя', last_name: 'Фамилия' } })
        await waitFor(loaded, 'RU fallback')
        assert(host.querySelector('#dashboard-title').textContent === 'Личный кабинет', 'Invalid language did not fall back')
        const identity = host.querySelector('.dashboard-profile').textContent
        assert(identity.includes('Настоящее имя Фамилия') && identity.includes('@test_user') && identity.includes('123456'), 'Profile is not from /me')
        const metadata = host.querySelector('.dashboard-profile-meta').textContent
        assert(metadata.includes('@test_user') && metadata.includes('TG ID 123456'), 'Profile metadata is separated')
        assert(host.querySelector('.dashboard-device-count').textContent.trim() === '0 / 5', 'Zero-device state changed')
        assert(!host.querySelector('.dashboard-device-list'), 'Fake devices were shown')
        assert(!host.querySelector('.dashboard-demo, #overview-title'), 'Development labels remain')
        assert(!/Демо|Обзор|примера|Overview|Demo|example/.test(host.querySelector('.dashboard-page').textContent), 'Development copy remains')
        assert(host.querySelector('button[aria-describedby="top-up-note"]').disabled, 'Payments became active')
        const support = host.querySelector('[aria-labelledby="support-title"]')
        const configuredSupportUrl = validateSupportUrl(import.meta.env.VITE_SUPPORT_TELEGRAM_URL)
        if (configuredSupportUrl) assert(support.querySelector('a')?.href === configuredSupportUrl, 'Configured support URL missing')
        else assert(support.querySelector('button')?.disabled && !support.querySelector('a'), 'Unconfigured support is not disabled')
        assert(requests.every(request => request.path === '/auth/me'), 'Business data triggered API calls')
      })
      await check('Dashboard navigation opens Plans and all four remaining placeholders return to /app', async () => {
        host.querySelector('a[href="/plans"]').click()
        await waitFor(() => currentPath === '/plans' && host.querySelector('#plans-title'), 'real Plans page')
        assert(!host.querySelector('#placeholder-title') && host.querySelector('.plans-options'), 'Plans is still a placeholder')
        assert(!host.querySelector('header') && host.querySelector('.dashboard-legal') && host.querySelector('.matrix-rain'), 'Plans internal shell changed')
        internalBack().click()
        await waitFor(loaded, 'Plans back arrow return')
        for (const path of ['/devices', '/referrals', '/terms', '/privacy']) {
          const link = host.querySelector(`a[href="${path}"]`)
          assert(link, `Missing dashboard link ${path}`)
          link.click()
          await waitFor(() => currentPath === path && host.querySelector('#placeholder-title'), path)
          assert(host.textContent.includes('Раздел готовится'), 'Missing placeholder notice')
          assert(!host.querySelector('header') && host.querySelector('footer') && host.querySelector('.matrix-rain'), 'Placeholder internal shell changed')
          internalBack().click()
          await waitFor(loaded, 'placeholder return')
        }
        assert(requests.every(request => request.path === '/auth/me'), 'Placeholder requested business data')
      })
      await check('Telegram profile has one gear with three floating controls and no normal header', async () => {
        await mount('/app', { fullApp: true })
        await waitFor(loaded, 'full App Telegram login')
        assert(!host.querySelector('header'), 'Telegram competes with native chrome')
        const card = host.querySelector('.dashboard-profile')
        const gear = card.querySelector('.profile-settings-toggle')
        const panel = card.querySelector('.profile-settings-panel')
        assert(gear && card.querySelectorAll('.profile-settings-toggle').length === 1, 'Missing or duplicate gear')
        assert(gear.getAttribute('aria-controls') === panel.id && gear.getAttribute('aria-expanded') === 'false', 'Missing disclosure semantics')
        assert(panel.inert && panel.querySelectorAll('button').length === 3, 'Wrong hidden controls')
        const height = card.getBoundingClientRect().height
        gear.focus()
        gear.click()
        await waitFor(() => gear.getAttribute('aria-expanded') === 'true', 'gear opens')
        await pause(250)
        assert(getComputedStyle(panel).position === 'absolute' && !panel.inert, 'Controls entered normal flow')
        assert(card.getBoundingClientRect().height === height, 'Opening gear increased profile height')
        assert(panel.getBoundingClientRect().right < gear.getBoundingClientRect().left, 'Controls did not expand to the left')
        const buttons = [...panel.querySelectorAll('button')]
        const bounds = buttons.map(button => button.getBoundingClientRect())
        assert(bounds.every(box => box.top === bounds[0].top && box.width === box.height), 'Controls are not square in one row')
        buttons[0].focus()
        assert(document.activeElement === buttons[0], 'Open controls cannot receive keyboard focus')
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }))
        await waitFor(() => panel.inert, 'Escape closes')
        assert(document.activeElement === gear, 'Escape lost focus')
        gear.click()
        await waitFor(() => !panel.inert, 'reopen')
        document.body.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }))
        await waitFor(() => panel.inert, 'outside closes')
        gear.click()
        await waitFor(() => !panel.inert, 'reopen toggle')
        gear.click()
        await waitFor(() => panel.inert, 'gear closes')
        gear.click()
        await waitFor(() => !panel.inert, 'reopen keyboard')
        host.querySelector('.dashboard-action').focus()
        await waitFor(() => panel.inert, 'focus outside closes')
      })
      await check('Telegram profile reuses and persists language/theme actions, closing after either action', async () => {
        const gear = host.querySelector('.profile-settings-toggle')
        const panel = host.querySelector('.profile-settings-panel')
        gear.click()
        await waitFor(() => !panel.inert, 'language controls open')
        click('Переключить на английский')
        await waitFor(() => panel.inert && document.documentElement.lang === 'en', 'language closes controls')
        assert(localStorage.getItem('lcp_language') === 'en', 'Telegram language did not persist')
        assert(document.activeElement === gear, 'Action lost gear focus')
        const oldTheme = localStorage.getItem('theme')
        gear.click()
        await waitFor(() => !panel.inert, 'theme controls open')
        panel.querySelector('.theme-btn').click()
        await waitFor(() => panel.inert && localStorage.getItem('theme') !== oldTheme, 'theme closes controls')
        assert(document.body.dataset.theme === localStorage.getItem('theme'), 'Theme persistence differs from UI')
      })
      await check('Full App Telegram gear logout reauthenticates without public header, landing or a loop', async () => {
        click('Account settings')
        await waitFor(() => !host.querySelector('.profile-settings-panel').inert, 'logout controls open')
        const stopWatchingHeader = watchForHeader()
        try {
          click('Logout')
          assert(!localStorage.getItem(tokenKey), 'Full App logout retained old JWT')
          await waitFor(() => currentPath === '/login', 'full App reauthentication')
          assert(!host.querySelector('header'), 'Public header rendered during Telegram reauthentication')
          await waitFor(loaded, 'full App renewed session')
          await pause(150)
          assert(localStorage.getItem(tokenKey) && count('/auth/telegram-webapp') === 2, 'Full App auth count or JWT incorrect')
          assert(!locations.includes('/') && !host.querySelector('.hero'), 'Full App logout exposed landing')
          assert(navigationType === 'REPLACE' && !host.querySelector('header'), 'Wrong restored dashboard')
          assert(!stopWatchingHeader(), 'Public header flashed during Telegram logout')
          assert(host.querySelector('.profile-settings-panel').inert, 'Logout left panel open')
          noChallenge()
        } finally { stopWatchingHeader() }
      })
      await check('Failed Telegram logout exchange has explicit retry and never falls through to landing', async () => {
        await mount('/app', { fullApp: true, token: 'fixture-jwt' })
        await waitFor(loaded, 'logout error setup')
        config.fail = 401
        click('Настройки аккаунта')
        await waitFor(() => !host.querySelector('.profile-settings-panel').inert, 'logout error controls')
        click('Выйти')
        await waitFor(failed, 'logout exchange fails safely')
        await pause(150)
        assert(currentPath === '/login' && count('/auth/telegram-webapp') === 1 && !localStorage.getItem(tokenKey), 'Failed logout loop or retained token')
        assert(!locations.includes('/') && !host.querySelector('.hero'), 'Failed logout exposed landing')
        assert(!host.querySelector('header'), 'Public header rendered on Telegram auth error')
        config.fail = false
        click('Попробовать снова')
        await waitFor(loaded, 'logout explicit retry')
        assert(count('/auth/telegram-webapp') === 2, 'Logout retry count')
        noChallenge()
      })
      await check('Telegram root replaces /app without ever rendering the public header or landing page', async () => {
        let renderedLanding = false
        const stopWatchingHeader = watchForHeader()
        const observer = new MutationObserver(records => {
          for (const record of records) for (const node of record.addedNodes) {
            if (node.nodeType === Node.ELEMENT_NODE && (node.matches('.hero') || node.querySelector('.hero'))) renderedLanding = true
          }
        })
        observer.observe(host, { childList: true, subtree: true })
        try {
          await mount('/', { fullApp: true })
          await waitFor(loaded, 'Telegram root redirect')
          await pause(150)
          assert(navigationType === 'REPLACE' && !renderedLanding, 'Root flashed landing or pushed history')
          assert(count('/auth/telegram-webapp') === 1, 'Root redirect caused an auth loop')
          assert(!host.querySelector('header'), 'Telegram root redirect retained the global header on /app')
          assert(!stopWatchingHeader(), 'Public header flashed during Telegram root redirect')
          noChallenge()
        } finally { observer.disconnect(); stopWatchingHeader() }
      })
      await check('Telegram login and internal routes omit the public header; internal children keep their back arrows', async () => {
        await mount('/login/', { fullApp: true, fail: 401 })
        await waitFor(failed, 'direct Telegram login')
        assert(currentPath === '/login/' && !host.querySelector('header'), 'Public header rendered on Telegram login')
        config.fail = false
        for (const path of ['/plans', '/devices', '/referrals', '/terms', '/privacy']) {
          navigate(path)
          await waitFor(() => currentPath === path && host.querySelector('.internal-page-title'), 'Telegram internal child')
          assert(!host.querySelector('header') && host.querySelector('.dashboard-legal'), 'Telegram child shell changed')
          assert(!host.querySelector('.profile-settings'), 'Profile controls leaked to a child page')
          internalBack().click()
          await waitFor(loaded, 'Telegram back arrow return')
          assert(!host.querySelector('header') && host.querySelector('.profile-settings'), 'Telegram dashboard shell changed')
        }
      })
      for (const [label, telegram] of [
        ['no SDK', undefined], ['SDK only', { WebApp: {} }],
        ['unsafe identity only', { WebApp: { initDataUnsafe: { user: { id: 123456 } } } }],
        ['whitespace raw data', { WebApp: { initData: '   ' } }],
      ]) {
        await check(`Ordinary browser /login keeps the global header with ${label}`, async () => {
          await mount('/login', { fullApp: true, browser: true, telegram })
          await waitFor(() => host.querySelector('.login-card'), 'browser direct login')
          assert(currentPath === '/login' && host.querySelector('header'), 'Browser login header was suppressed')
          assert(count('/auth/telegram-webapp') === 0, 'Browser login started Mini App authentication')
        })
        await check(`Ordinary browser root stays public with ${label}`, async () => {
          await mount('/', { fullApp: true, browser: true, telegram })
          await waitFor(() => host.querySelector('.hero'), 'browser landing')
          assert(currentPath === '/' && navigationType === 'POP', 'Non-Mini-App root redirected')
          assert(host.querySelector('header') && !host.querySelector('.profile-settings'), 'Public header changed')
          assert(requests.length === 0, 'Browser root initiated authentication')
        })
      }
      await check('Browser profile gear preserves theme actions and logout returns to public login', async () => {
        await mount('/app', { fullApp: true, browser: true, token: 'fixture-jwt' })
        await waitFor(loaded, 'browser profile gear')
        assert(!host.querySelector('header') && !host.querySelector('.internal-back'), 'Wrong browser dashboard shell')
        const gear = host.querySelector('.profile-settings-toggle')
        const panel = host.querySelector('.profile-settings-panel')
        assert(gear && host.querySelectorAll('.profile-settings-toggle').length === 1, 'Browser gear missing or duplicated')
        assert(panel.inert && panel.querySelectorAll('button').length === 3, 'Wrong browser settings controls')
        const height = host.querySelector('.dashboard-profile').getBoundingClientRect().height
        gear.click()
        await waitFor(() => !panel.inert, 'browser gear opens')
        await pause(250)
        assert(host.querySelector('.dashboard-profile').getBoundingClientRect().height === height, 'Browser settings caused reflow')
        assert(panel.getBoundingClientRect().right < gear.getBoundingClientRect().left, 'Browser controls did not open left')
        const oldTheme = localStorage.getItem('theme')
        panel.querySelector('.theme-btn').click()
        await waitFor(() => panel.inert && localStorage.getItem('theme') !== oldTheme, 'browser theme action')
        assert(document.activeElement === gear, 'Browser action lost focus')
        gear.click()
        await waitFor(() => !panel.inert, 'browser logout controls')
        click('Выйти')
        assert(!localStorage.getItem(tokenKey), 'Browser gear logout retained JWT')
        await waitFor(() => currentPath === '/login' && host.querySelector('.login-card'), 'browser gear logout')
        assert(host.querySelector('header') && navigationType === 'REPLACE', 'Browser logout lost public login header or replace semantics')
        assert(count('/auth/telegram-webapp') === 0 && !locations.includes('/'), 'Browser logout changed auth flow')
      })
      for (const browser of [true, false]) {
        await check(`${browser ? 'Browser' : 'Telegram'} internal pages share safe-area spacing without reserving the old header`, async () => {
          await mount('/app', { fullApp: true, browser, token: 'fixture-jwt' })
          await waitFor(loaded, 'internal spacing fixture')
          const style = document.documentElement.style
          const properties = ['--header-height', '--tg-content-safe-area-inset-top']
          const previous = properties.map(name => [name, style.getPropertyValue(name), style.getPropertyPriority(name)])
          try {
            style.setProperty('--header-height', '999px')
            if (!browser) style.setProperty('--tg-content-safe-area-inset-top', '72px')
            const rem = parseFloat(getComputedStyle(document.documentElement).fontSize)
            const expected = browser ? rem * (matchMedia('(max-width: 640px)').matches ? 1.75 : 2.5) : 72 + rem * 1.5 + 20
            for (const path of ['/app', '/plans', '/devices', '/referrals', '/terms', '/privacy']) {
              navigate(path)
              await waitFor(() => currentPath === path && host.querySelector('.dashboard-page h1'), 'internal page spacing')
              const page = host.querySelector('.dashboard-page')
              assert(!host.querySelector('header'), `Internal header rendered on ${path}`)
              assert(Math.abs(parseFloat(getComputedStyle(page).paddingTop) - expected) < 0.1, `Incorrect top spacing on ${path}`)
              assert(Boolean(host.querySelector('.internal-shell--telegram')) === !browser, 'Telegram spacing leaked into browser')
            }
          } finally {
            for (const [name, value, priority] of previous) {
              if (value) style.setProperty(name, value, priority)
              else style.removeProperty(name)
            }
          }
        })
      }
      await check('Plans selects periods/plans, recalculates totals and never enables or requests payment', async () => {
        await mount('/plans', { fullApp: true, browser: true, token: 'fixture-jwt' })
        await waitFor(() => host.querySelector('#plans-title'), 'Plans initial state')
        const total = () => host.querySelector('.plans-payment-total').textContent.replace(/\s/g, '')
        const selectPeriod = months => host.querySelector(`input[name="plans-period"][value="${months}"]`).click()
        const selectPlan = id => host.querySelector(`input[name="plans-plan"][value="${id}"]`).closest('label').click()
        assert(host.querySelector('#plans-title').textContent === 'Тарифы', 'Plans did not use RU default')
        assert(host.querySelector('.plans-balance dd').textContent.replace(/\s/g, '') === '0₽', 'Wrong mock balance')
        assert(host.querySelector('input[name="plans-period"]:checked').value === '1', 'Wrong initial period')
        assert(!host.querySelector('input[name="plans-plan"]:checked') && total() === '0₽', 'Plan was preselected')
        assert(host.querySelector('.plans-payment-copy p').textContent === 'Тариф не выбран', 'Missing empty summary')
        assert(host.querySelectorAll('.plans-discount').length === 2 && !host.querySelector('.plans-period-total'), 'Wrong monthly presentation')
        assert(host.querySelector('.plans-pay').disabled, 'Unselected payment is enabled')
        selectPeriod(6)
        await waitFor(() => host.querySelectorAll('.plans-period-total').length === 3, 'discounted prices')
        assert(total() === '0₽' && !host.querySelector('input[name="plans-plan"]:checked'), 'Period implicitly selected a plan')
        const expected = { basic: [1615, 269], plus: [3235, 539], 'pro-plus': [5395, 899] }
        for (const [id, [amount, monthly]] of Object.entries(expected)) {
          selectPlan(id)
          await waitFor(() => total() === `${amount}₽`, 'six-month selection')
          const row = host.querySelector(`input[value="${id}"]`).closest('label')
          assert(row.querySelector('.plans-monthly').textContent.replace(/\s/g, '') === `≈${monthly}₽/мес`, 'Incorrect monthly approximation')
          assert(row.querySelector('.plans-period-total').textContent.replace(/\s/g, '') === `${amount}₽за6мес`, 'Incorrect authoritative total')
          assert(host.querySelector('.plans-pay').disabled, 'Selected payment is enabled')
        }
        selectPeriod(12)
        await waitFor(() => total() === '9590₽', 'annual repricing')
        assert(host.querySelector('input[name="plans-plan"]:checked').value === 'pro-plus', 'Period lost the selected plan')
        assert(host.querySelector('.plans-payment-copy p').textContent === 'Pro Plus · 12 месяцев', 'Summary did not follow period')
        selectPeriod(1)
        await waitFor(() => total() === '999₽', 'monthly repricing')
        assert(!host.querySelector('.plans-period-total') && !host.querySelector('.plans-monthly').textContent.includes('≈'), 'Monthly price retained discount UI')
        host.querySelector('.plans-pay').click()
        assert(requests.length === 0, 'Plans made an API/payment request')
        internalBack().click()
        await waitFor(loaded, 'return to settings for language')
        click('Настройки аккаунта')
        await waitFor(() => !host.querySelector('.profile-settings-panel').inert, 'language settings open')
        click('Переключить на английский')
        await waitFor(() => document.documentElement.lang === 'en', 'global language change')
        assert(localStorage.getItem('lcp_language') === 'en', 'Plans bypassed global language persistence')
        host.querySelector('a[href="/plans"]').click()
        await waitFor(() => host.querySelector('#plans-title')?.textContent === 'Plans', 'Plans EN')
        assert(!host.querySelector('input[name="plans-plan"]:checked') && total() === '0₽', 'Purchase selection was persisted across navigation')
        const beforePlanActions = requests.length
        selectPlan('pro-plus')
        selectPeriod(12)
        await waitFor(() => total() === '9,590₽', 'EN annual repricing')
        assert(host.querySelector('.plans-payment-copy p').textContent === 'Pro Plus · 12 months', 'Summary not translated')
        assert(host.querySelector('.plans-features').textContent.includes('2 devices') && host.querySelector('.plans-features').textContent.includes('Bypass 50 GB'), 'Plan features not translated')
        assert(host.querySelector('.plans-pay').textContent === 'Pay' && host.querySelector('#plans-payment-note').textContent === 'Payment will be available soon', 'Payment not translated')
        host.querySelector('.plans-pay').click()
        assert(requests.length === beforePlanActions, 'Plans made an API/payment request')
        await mount('/plans', { fullApp: true, browser: true, reuseStorage: true })
        await waitFor(() => host.querySelector('#plans-title'), 'Plans revisit')
        assert(host.querySelector('#plans-title').textContent === 'Plans', 'Global language did not persist')
        assert(!host.querySelector('input[name="plans-plan"]:checked') && host.querySelector('input[name="plans-period"]:checked').value === '1' && total() === '0₽', 'Purchase selection was persisted')
        assert(requests.length === 0, 'Plans revisit made an API request')
      })
      await check('Plans preserves the current selection when its language prop changes', async () => {
        const renderPlans = lang => root.render(h(MemoryRouter, null, h(Plans, { lang })))
        renderPlans('ru')
        await waitFor(() => host.querySelector('#plans-title')?.textContent === 'Тарифы', 'isolated RU Plans')
        host.querySelector('input[name="plans-plan"][value="plus"]').click()
        host.querySelector('input[name="plans-period"][value="6"]').click()
        await waitFor(() => host.querySelector('.plans-payment-total').textContent.replace(/\s/g, '') === '3235₽', 'isolated selection')
        renderPlans('en')
        await waitFor(() => host.querySelector('#plans-title').textContent === 'Plans', 'isolated EN Plans')
        assert(host.querySelector('input[name="plans-plan"]:checked').value === 'plus' && host.querySelector('input[name="plans-period"]:checked').value === '6', 'Language prop reset purchase state')
        assert(host.querySelector('.plans-payment-total').textContent.replace(/\s/g, '') === '3,235₽', 'Language changed the selected total')
      })
      await check('Profile without username retains a compact Telegram ID without a separator', async () => {
        await mount('/app', { browser: true, token: 'fixture-jwt', profile: { ...profile, username: null } })
        await waitFor(loaded, 'no-username profile')
        const metadata = host.querySelector('.dashboard-profile-meta')
        assert(metadata.textContent === 'TG ID 123456', 'Missing ID or stray separator')
      })
      await check('Support action stays disabled for missing or invalid configuration', async () => {
        for (const url of [null, '', 'https://example.com/support', 'https://t.me/fixture_support?url=unsafe']) {
          root.render(h(SupportAction, { lang: 'ru', url }))
          await pause(50)
          await waitFor(() => host.querySelector('button[aria-describedby="support-note"]'), 'disabled support')
          assert(host.querySelector('button').disabled && !host.querySelector('a'), 'Unsafe support navigation')
          host.querySelector('button').click()
          assert(popups.length === 0, 'Disabled support opened a popup')
        }
      })
      await check('Support uses the native browser link, Telegram bridge or fallback as appropriate', async () => {
        const url = 'https://t.me/fixture_support'
        root.render(h(SupportAction, { lang: 'en', url }))
        await waitFor(() => host.querySelector('a'), 'active support')
        const link = host.querySelector('a')
        assert(link.href === url && link.textContent.includes('Contact'), 'Wrong support link')
        assert(link.target === '_blank' && link.rel.includes('noopener') && link.rel.includes('noreferrer'), 'Unsafe external link')
        function clickSupport(options = {}) {
          let prevented
          host.addEventListener('click', event => {
            prevented = event.defaultPrevented
            event.preventDefault() // Never actually open Telegram from these tests.
          }, { once: true })
          link.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, button: 0, ...options }))
          return prevented
        }
        window.Telegram = undefined
        assert(clickSupport() === false, 'Normal browser lost native navigation')
        const opened = []
        window.Telegram = { WebApp: { platform: 'ios', openTelegramLink: value => opened.push(value) } }
        assert(clickSupport() === true && opened.length === 1 && opened[0] === url, 'Telegram bridge was not used')
        assert(clickSupport({ ctrlKey: true }) === false && opened.length === 1, 'Modified click was intercepted')
        window.Telegram.WebApp.openTelegramLink = () => { throw new Error('unsupported') }
        assert(clickSupport() === false, 'Bridge failure disabled native fallback')
      })
      window.authTestResult = { passed: results.length, checks: results }
    } catch (error) {
      window.authTestResult = { passed: results.length, checks: results, error: error.message }
    } finally {
      root?.unmount()
      document.querySelector('#results').textContent = JSON.stringify(window.authTestResult, null, 2)
    }
  </script>
</body>
